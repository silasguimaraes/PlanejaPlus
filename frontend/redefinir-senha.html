<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Redefinir senha | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Planeja+">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./login.html">Login</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <main class="container narrow">
      <section class="panel">
        <h1>Nova senha</h1>
        <p class="muted">Escolha uma nova senha para acessar o Planeja+.</p>

        <form id="redefinir-form" class="form">
          <label>
            Nova senha
            <input name="senha" type="password" required minlength="8" maxlength="72" autocomplete="new-password" />
          </label>

          <label>
            Confirmar nova senha
            <input name="confirmarSenha" type="password" required minlength="8" maxlength="72" autocomplete="new-password" />
          </label>

          <p class="muted">A senha deve ter pelo menos 8 caracteres e incluir um símbolo.</p>
          <button class="button primary full" type="submit">Redefinir senha</button>
          <p id="message" class="message" role="status"></p>
        </form>

        <div id="invalid-link" hidden>
          <p id="invalid-link-message" class="message error" role="status"></p>
          <p class="muted"><a class="text-link" href="./esqueci-senha.html">Solicitar um novo link</a></p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/redefinirSenha.js"></script>
  </body>
</html>
