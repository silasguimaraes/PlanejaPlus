<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="app-page reports-page">
    <!-- Cabecalho das paginas internas com link para sair. -->
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Planeja+">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./movimentacoes.html">Movimentações</a>
        <a href="./categorias.html">Categorias</a>
        <a href="./relatorios.html" aria-current="page">Relatórios</a>
        <a href="./faq.html">FAQ</a>
        <a href="./admin.html" data-admin-link>Admin</a>
        <a href="./login.html" data-logout>Sair</a>
      </nav>
    </header>

    <!-- Conteudo principal de filtros, resumo e tabela do relatorio. -->
    <main class="container">
      <!-- Titulo e descricao da pagina de relatorios. -->
      <section class="page-heading">
        <p class="eyebrow">Análise</p>
        <h1>Relatórios</h1>
        <p class="muted">Filtre as movimentações por período e exporte o resumo em PDF ou Excel.</p>
      </section>

      <!-- Formulario de filtros usado pelo relatorios.js. -->
      <section class="panel">
        <form class="filters">
          <label>
            Data inicial
            <input id="periodo-inicio" type="date" />
          </label>

          <label>
            Data final
            <input id="periodo-fim" type="date" />
          </label>

          <label>
            Tipo
            <select id="relatorio-tipo">
              <option value="todos">Todos</option>
              <option value="receita">Receitas</option>
              <option value="despesa">Despesas</option>
            </select>
          </label>

          <button class="button primary report-action" type="submit">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
            </svg>
            Gerar relatório
          </button>
          <button id="exportar-pdf" class="button secondary report-action" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
            </svg>
            Exportar PDF
          </button>
          <button id="exportar-excel" class="button secondary report-action" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
            </svg>
            Exportar Excel
          </button>
        </form>
      </section>

      <!-- Cards de totais atualizados conforme o filtro do relatorio. -->
      <section class="stats-grid report-stats">
        <article class="stat-card report-stat-card report-stat-card--income">
          <span class="report-stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m4 16 6-6 4 4 6-8M14 6h6v6" />
            </svg>
          </span>
          <div>
            <p class="stat-label">Total de receitas</p>
            <strong id="relatorio-receitas" class="positive">R$ 0,00</strong>
          </div>
        </article>

        <article class="stat-card report-stat-card report-stat-card--expenses">
          <span class="report-stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m4 8 6 6 4-4 6 8m-6 0h6v-6" />
            </svg>
          </span>
          <div>
            <p class="stat-label">Total de despesas</p>
            <strong id="relatorio-despesas" class="negative">R$ 0,00</strong>
          </div>
        </article>

        <article class="stat-card report-stat-card report-stat-card--balance">
          <span class="report-stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14" />
            </svg>
          </span>
          <div>
            <p class="stat-label">Resultado</p>
            <strong id="relatorio-saldo">R$ 0,00</strong>
          </div>
        </article>
      </section>

      <!-- Tabela de detalhamento agrupado por categoria e tipo. -->
      <section class="panel">
        <h2>Detalhamento</h2>
        <p id="message" class="message" role="status"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="relatorio-detalhes"></tbody>
          </table>
        </div>
      </section>
    </main>
    <!-- Bibliotecas externas e scripts locais usados no relatorio. -->
    <!-- Foi utilizada a biblioteca jsPDF para geração do documento PDF. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/relatorios.js"></script>
  </body>
</html>
