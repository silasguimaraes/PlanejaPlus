<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatorios | Planeja+</title>
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body class="reports-body">
    <!-- Cabecalho das paginas internas com link para sair. -->
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo brand-logo-light" />
        <img src="./img/logo-dark.png" alt="" aria-hidden="true" class="brand-logo brand-logo-dark" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./movimentacoes.html">Movimentações</a>
        <a href="./categorias.html">Categorias</a>
        <a href="./relatorios.html" aria-current="page">Relatórios</a>
        <a href="./faq.html">FAQ</a>
        <a href="./admin.html" data-admin-link>Admin</a>
        <a href="./login.html" data-logout>Sair</a>
        <label class="switch">
          <span class="sun" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="#ffd43b"><circle r="5" cy="12" cx="12"></circle><path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm-17 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm13.66-5.66a1 1 0 0 1-.66-.29 1 1 0 0 1 0-1.41l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1-.75.29zm-12.02 12.02a1 1 0 0 1-.71-.29 1 1 0 0 1 0-1.41l.71-.66a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1-.7.24zm6.36-14.36a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm0 17a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm-5.66-14.66a1 1 0 0 1-.7-.29l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.29zm12.02 12.02a1 1 0 0 1-.7-.29l-.66-.71a1 1 0 0 1 1.36-1.36l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.24z"></path></g></svg></span>
          <span class="moon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="m223.5 32c-123.5 0-223.5 100.3-223.5 224s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path></svg></span>
          <input type="checkbox" class="input" data-theme-toggle aria-label="Ativar modo escuro" />
          <span class="slider"></span>
        </label>
      </nav>
    </header>

    <!-- Conteudo principal de filtros, resumo e tabela do relatorio. -->
    <main class="reports-page">
      <!-- Titulo e descricao da pagina de relatorios. -->
      <section class="page-heading reports-heading">
        <p class="eyebrow">Análise</p>
        <h1>Relatórios</h1>
        <p class="muted">Filtre as movimentações por período e exporte o resumo em PDF ou Excel.</p>
      </section>

      <!-- Formulario de filtros usado pelo relatorios.js. -->
      <section class="panel reports-filter-panel">
        <form class="filters reports-filters">
          <label>
            Data inicial
            <input id="periodo-inicio" type="date" />
          </label>

          <label>
            Data final
            <input id="periodo-fim" type="date" />
          </label>

          <label>
            Tipo
            <select id="relatorio-tipo">
              <option value="todos">Todos</option>
              <option value="receita">Receitas</option>
              <option value="despesa">Despesas</option>
            </select>
          </label>

          <button class="button primary" type="submit">
            <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 1.5v8m0 0 3-3m-3 3-3-3M2.5 10.5v3h11v-3" /></svg>
            Gerar relatório
          </button>
          <div class="reports-export-actions">
            <button id="exportar-pdf" class="button secondary" type="button">
              <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2v8m0 0 3-3m-3 3-3-3M2.5 10.5v3h11v-3" /></svg>
              Exportar PDF
            </button>
            <button id="exportar-excel" class="button secondary" type="button">
              <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2v8m0 0 3-3m-3 3-3-3M2.5 10.5v3h11v-3" /></svg>
              Exportar Excel
            </button>
          </div>
        </form>
      </section>

      <!-- Cards de totais atualizados conforme o filtro do relatorio. -->
      <section class="stats-grid reports-stats">
        <article class="stat-card reports-stat-card">
          <span class="reports-stat-icon reports-stat-icon--income" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 16 6-6 4 4 6-7M14 7h6v6" /></svg>
          </span>
          <div class="reports-stat-info">
            <p class="stat-label">Total de receitas</p>
            <strong id="relatorio-receitas" class="positive">R$ 0,00</strong>
          </div>
        </article>

        <article class="stat-card reports-stat-card">
          <span class="reports-stat-icon reports-stat-icon--expense" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 8 6 6 4-4 6 7m-6 0h6v-6" /></svg>
          </span>
          <div class="reports-stat-info">
            <p class="stat-label">Total de despesas</p>
            <strong id="relatorio-despesas" class="negative">R$ 0,00</strong>
          </div>
        </article>

        <article class="stat-card reports-stat-card">
          <span class="reports-stat-icon reports-stat-icon--balance" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 8h14M5 16h14" /></svg>
          </span>
          <div class="reports-stat-info">
            <p class="stat-label">Resultado</p>
            <strong id="relatorio-saldo">R$ 0,00</strong>
          </div>
        </article>
      </section>

      <!-- Tabela de detalhamento agrupado por categoria e tipo. -->
      <section class="panel reports-detail-panel">
        <h2>Detalhamento</h2>
        <p id="message" class="message" role="status"></p>
        <div class="table-wrap">
          <table class="reports-table">
            <thead>
              <tr>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="relatorio-detalhes"></tbody>
          </table>
        </div>
      </section>
    </main>
    <!-- Bibliotecas externas e scripts locais usados no relatorio. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/relatorios.js"></script>
  </body>
</html>
