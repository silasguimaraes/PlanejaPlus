<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorias | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="app-page">
    <!-- Cabecalho das paginas autenticadas. -->
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Planeja+">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./categorias.html" aria-current="page">Categorias</a>
        <a href="./movimentacoes.html">Movimentações</a>
        <a href="./relatorios.html">Relatórios</a>
        <a href="./faq.html">FAQ</a>
        <a href="./admin.html" data-admin-link>Admin</a>
        <a href="./login.html" data-logout>Sair</a>
      </nav>
    </header>

    <!-- Grid com formulario de criacao e lista de categorias. -->
    <main class="container management-page categories-page">
      <section class="page-heading management-heading">
        <p class="eyebrow">Categorias</p>
        <h1>Minhas categorias</h1>
      </section>

      <section class="panel management-form-panel">
        <h2>Categorias</h2>
        <p class="muted">Cadastre categorias de receita ou despesa.</p>

        <form id="categoria-form" class="form">
          <label>
            Nome
            <input name="nome" type="text" placeholder="Ex.: Alimentação" required />
          </label>

          <label>
            Tipo
            <select name="tipo" required>
              <option value="despesa">Despesa</option>
              <option value="receita">Receita</option>
            </select>
          </label>

          <button class="button primary full category-create-button" type="submit">
            <span aria-hidden="true">+</span>
            Criar categoria
          </button>
          <p id="message" class="message" role="status"></p>
        </form>
      </section>

      <section class="panel management-list-panel">
        <div id="categorias-lista" class="list"></div>
      </section>
    </main>
    <!-- Dependencias e scripts da pagina de categorias. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/categorias.js"></script>
  </body>
</html>
