<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="app-page auth-page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Planeja+">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./login.html">Login</a>
        <a href="./cadastro.html" data-public-registration>Cadastro</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <div id="auth-bg-field" class="hero-wrapper auth-wrapper">
      <main class="container narrow auth-container">
        <section class="panel">
          <h1 class="auth-title">Esqueci minha senha</h1>
          <p class="muted auth-description">Informe seu email para receber um link de redefinição.</p>

          <form id="esqueci-form" class="form auth-form">
            <label>
              <span class="sr-only">Email</span>
              <input name="email" type="email" placeholder="Email" required autocomplete="email" />
            </label>

            <button class="button primary full" type="submit">Enviar link de recuperação</button>
            <p id="message" class="message" role="status"></p>
          </form>

          <p class="muted"><a class="text-link" href="./login.html">Voltar para o login</a></p>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/esqueciSenha.js"></script>
    <script type="module" src="./js/authRibbonGlow.js"></script>
  </body>
</html>
