<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Planeja+">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./login.html">Login</a>
        <a href="./cadastro.html" data-public-registration>Cadastro</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <main class="container narrow">
      <section class="panel">
        <h1>Esqueci minha senha</h1>
        <p class="muted">Informe seu email e enviaremos um link para criar uma nova senha.</p>

        <form id="esqueci-form" class="form">
          <label>
            Email
            <input name="email" type="email" required autocomplete="email" />
          </label>

          <button class="button primary full" type="submit">Enviar link de recuperação</button>
          <p id="message" class="message" role="status"></p>
        </form>

        <p class="muted"><a class="text-link" href="./login.html">Voltar para o login</a></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/esqueciSenha.js"></script>
  </body>
</html>
