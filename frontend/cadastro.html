<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="app-page auth-page">
    <!-- Cabecalho com links para navegar entre cadastro, login e dashboard. -->
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Planeja+">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html" data-auth-required>Dashboard</a>
        <a href="./login.html">Login</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <div id="auth-bg-field" class="hero-wrapper auth-wrapper">
      <!-- Area principal com largura reduzida para focar no formulario. -->
      <main class="container narrow auth-container">
        <!-- Painel que agrupa as informacoes de criacao de conta. -->
        <section class="panel">
          <h1 class="auth-title">Criar conta</h1>
          <p class="muted auth-description">Crie sua conta Planeja+ para começar a organizar suas finanças</p>

          <!-- Formulario lido pelo cadastro.js para enviar os dados ao backend. -->
          <form id="cadastro-form" class="form auth-form">
            <label>
              <span class="sr-only">Nome</span>
              <input name="nome" type="text" placeholder="Nome" autocomplete="name" required />
            </label>

            <label>
              <span class="sr-only">Email</span>
              <input name="email" type="email" placeholder="Email" autocomplete="email" required />
            </label>

            <label>
              <span class="sr-only">Senha</span>
              <input name="senha" type="password" placeholder="Senha" autocomplete="new-password" required minlength="6" />
            </label>

            <button class="button primary full" type="submit">Cadastrar</button>
            <p id="message" class="message" role="status"></p>
          </form>
          <p id="registration-disabled" class="message error" role="status" hidden></p>
          <p class="muted auth-footer">Já tem uma conta? <a class="text-link" href="./login.html">Entrar</a></p>
        </section>
      </main>
    </div>
    <!-- Dependencias e scripts da pagina. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/cadastro.js"></script>
    <script type="module" src="./js/authRibbonGlow.js"></script>
  </body>
</html>
