<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="app-page auth-page">
    <!-- Cabecalho simples da tela de login. -->
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Planeja+">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html" data-auth-required>Dashboard</a>
        <a href="./cadastro.html" data-public-registration>Cadastro</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <div id="auth-bg-field" class="hero-wrapper auth-wrapper">
      <!-- Container estreito para centralizar o formulario de entrada. -->
      <main class="container narrow auth-container">
        <!-- Painel visual que agrupa titulo, texto e formulario. -->
        <section class="panel">
          <h1 class="auth-title">Entrar</h1>
          <p class="muted auth-description">Acesse sua conta Planeja+ para continuar</p>

          <!-- Formulario que envia email e senha para o script login.js. -->
          <form id="login-form" class="form auth-form">
            <label>
              <span class="sr-only">Email</span>
              <input name="email" type="email" placeholder="Email" autocomplete="email" required />
            </label>

            <label>
              <span class="sr-only">Senha</span>
              <input name="senha" type="password" placeholder="Senha" autocomplete="current-password" required />
            </label>

            <p class="auth-forgot"><a class="text-link" href="./esqueci-senha.html">Esqueci minha senha</a></p>
            <button class="button primary full" type="submit">Entrar</button>
            <p id="message" class="message" role="status"></p>
          </form>
          <p class="muted auth-footer" data-public-registration>Ainda não tem uma conta? <a class="text-link" href="./cadastro.html">Criar conta</a></p>
        </section>
      </main>
    </div>
    <!-- Bibliotecas e scripts carregados no fim para encontrar o HTML ja montado. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/login.js"></script>
    <script type="module" src="./js/authRibbonGlow.js"></script>
  </body>
</html>
